# Provider catalog — defines what providers and models are available in the UI.
#
# structured_output: true  → requests use response_format=json_schema.
#                            LiteLLM translates per provider:
#                              OpenAI   → native json_schema
#                              Anthropic → tool use
#                              Gemini   → response_schema
# structured_output: false → falls back to response_format=json_object
#                            with regex-based extraction (used for Ollama).
#
# api_base: only needed for self-hosted providers (e.g. Ollama).
# Model IDs must be valid LiteLLM strings (used verbatim in API calls).

anthropic:
  structured_output: true
  vision: true
  default_model: claude-sonnet-4-6
  available_models:
    - id: claude-sonnet-4-6
      display_name: "Claude Sonnet 4.6"
    - id: claude-opus-4-8
      display_name: "Claude Opus 4.8"
    - id: claude-haiku-4-5-20251001
      display_name: "Claude Haiku 4.5"
    - id: claude-fable-5
      display_name: "Claude Fable 5"
  defaults:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 3

openai:
  structured_output: true
  vision: true
  default_model: gpt-4o
  available_models:
    - id: gpt-4o
      display_name: "GPT-4o"
    - id: gpt-4o-mini
      display_name: "GPT-4o Mini"
    - id: o3-mini
      display_name: "o3 Mini"
  defaults:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 3

google:
  structured_output: true
  vision: true
  default_model: gemini/gemini-2.0-flash
  available_models:
    - id: gemini/gemini-2.0-flash
      display_name: "Gemini 2.0 Flash"
    - id: gemini/gemini-1.5-pro
      display_name: "Gemini 1.5 Pro"
    - id: gemini/gemini-2.5-pro
      display_name: "Gemini 2.5 Pro"
  defaults:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 3

ollama:
  structured_output: false
  vision: false
  api_base: "http://localhost:11434"
  default_model: ollama/llama3.2
  available_models:
    - id: ollama/llama3.2
      display_name: "Llama 3.2 3B (local)"
    - id: ollama/llama3.2:1b
      display_name: "Llama 3.2 1B (local)"
    - id: ollama/mistral
      display_name: "Mistral 7B (local)"
    - id: ollama/phi4
      display_name: "Phi-4 (local)"
  defaults:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
    timeout_seconds: 120
    max_retries: 2
