# Provider catalog — defines what providers and models are available in the UI.
#
# Each entry has:
#   default_model    — pre-selected model in the UI form
#   available_models — list of (id, display_name) pairs shown in dropdowns
#   defaults         — form pre-fill values; used when no override is provided
#
# Model IDs must be valid LiteLLM strings (used verbatim in API calls).

anthropic:
  default_model: claude-sonnet-4-6
  available_models:
    - id: claude-sonnet-4-6
      display_name: "Claude Sonnet 4.6"
    - id: claude-opus-4-8
      display_name: "Claude Opus 4.8"
    - id: claude-haiku-4-5-20251001
      display_name: "Claude Haiku 4.5"
    - id: claude-fable-5
      display_name: "Claude Fable 5"
  defaults:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 3

openai:
  default_model: gpt-4o
  available_models:
    - id: gpt-4o
      display_name: "GPT-4o"
    - id: gpt-4o-mini
      display_name: "GPT-4o Mini"
    - id: o3-mini
      display_name: "o3 Mini"
  defaults:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 3

google:
  default_model: gemini/gemini-2.0-flash
  available_models:
    - id: gemini/gemini-2.0-flash
      display_name: "Gemini 2.0 Flash"
    - id: gemini/gemini-1.5-pro
      display_name: "Gemini 1.5 Pro"
    - id: gemini/gemini-2.5-pro
      display_name: "Gemini 2.5 Pro"
  defaults:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 3
